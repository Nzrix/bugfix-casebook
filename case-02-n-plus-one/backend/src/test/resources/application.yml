spring:
  datasource:
    url: jdbc:h2:mem:nplusone;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true

logging:
  level:
    org.hibernate.stat: INFO
