name: Bug-Fix Casebook CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Test Case 01 - Timezone Bug
      run: |
        cd case-01-timezone-bug/backend
        mvn test --batch-mode --fail-at-end
    
    - name: Test Case 02 - N+1 Query Problem
      run: |
        cd case-02-n-plus-one/backend
        mvn test --batch-mode --fail-at-end
    
    - name: Test Case 03 - Missing Pagination
      run: |
        cd case-03-missing-pagination/backend
        mvn test --batch-mode --fail-at-end
    
    - name: Test Case 04 - Race Condition
      run: |
        cd case-04-race-condition/backend
        mvn test --batch-mode --fail-at-end
    
    - name: Test Case 05 - Angular Memory Leak (Backend)
      run: |
        cd case-05-angular-memory-leak/backend
        mvn test --batch-mode --fail-at-end
    
    - name: Test Case 06 - Validation Handling
      run: |
        cd case-06-validation-handling/backend
        mvn test --batch-mode --fail-at-end
    
    - name: All Tests Summary
      if: always()
      run: |
        echo "✅ All bug-fix casebook tests completed!"
        echo "Check individual step results above for details."
