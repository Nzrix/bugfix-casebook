spring:
  datasource:
    url: jdbc:h2:mem:race;DB_CLOSE_DELAY=-1;MODE=MySQL;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          batch_size: 0

logging:
  level:
    org.hibernate.SQL: INFO
